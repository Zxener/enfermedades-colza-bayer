<script>
const get = id => document.getElementById(id);
const exam = get('exam');
const storageKey = 'unahur-bayer-colza-v1';
const bytes = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));
let answers = {};
let graded = false;
try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
  answers = saved.answers || {};
  graded = saved.graded === true;
} catch {}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify({answers, graded})); } catch {}
}
function render({questions, titles, cards: diseases}) {
  const fichas = diseases.map(([title,en,slug,agent,signs,impact,care], i) => {
    return '<article class="panel ficha" id="lamina-' + (i+1) + '"><p class="eyebrow">' + (i+1) + ' / 10 · ' + en + '</p><h2>' + title + '</h2><p class="agent">' + agent + '</p><dl><dt>Qué observar</dt><dd>' + signs + '</dd><dt>Importancia y antecedentes</dt><dd>' + impact + '</dd><dt>Monitoreo y prevención</dt><dd>' + care + '</dd></dl><p><a href="https://cropscience.bayer.co.uk/agronomy-id/diseases/oilseed-rape-diseases/' + slug + '" target="_blank" rel="noopener">Ficha original de Bayer y fotografías de diagnóstico ↗</a></p></article>';
  }).join('');

  const index = titles.map((title, i) => '<li><a href="#lamina-' + (i+1) + '">' + title + '</a></li>').join('');
  const groups = titles.map((title, group) => {
    const cards = questions.flatMap(([unit, prompt, ...choices], i) => {
      if (Number(unit) !== group + 1) return [];
      const order = [0,1,2];
      order.push(...order.splice(0, (i * 7 + Math.floor(i / 7)) % 3));
      return '<fieldset class="question"><legend>' + (i+1) + '. ' + prompt + ' <span class="points">(1 punto)</span></legend>' +
        order.map(choice => '<label><input type="radio" name="q' + i + '" value="' + choice + '">' + choices[choice] + '</label>').join('') +
        '<p class="feedback" hidden></p></fieldset>';
    }).join('');
    return '<section class="panel module" id="repaso-' + (group+1) + '"><h2>' + (group+1) + '. ' + title + '</h2>' + cards + '</section>';
  }).join('');
  exam.innerHTML = '<nav class="bar" aria-label="Herramientas"><strong id="counter" aria-live="polite"></strong><a href="#indice">Índice</a><a href="#repaso">Repaso</a><button id="print" type="button" class="secondary">Imprimir A4</button></nav>' +
    '<header class="panel"><p class="eyebrow">UNAHUR · Tecnicatura Universitaria en Viverismo</p><h1>ENFERMEDADES DE LA PÁGINA DE BAYER</h1><p>Fundamentos de Sanidad Vegetal · Carlos Arturo d’Albuquerque</p><p class="credit">Diez enfermedades de la colza (Brassica napus), en el orden de Bayer Crop Science Reino Unido. Consultá las fichas, compará los síntomas y completá el repaso al final.</p></header>' +
    '<nav class="panel" id="indice" aria-label="Índice de las diez enfermedades"><h2>Índice</h2><ol class="index">' + index + '</ol></nav>' + fichas + '<section class="panel" id="repaso"><h2>50 preguntas de repaso</h2><p>Cada acierto suma un punto. La corrección muestra las respuestas, y el avance queda guardado en este navegador.</p></section><form id="questions">' + groups +
    '<section class="panel finish" id="resultado"><h2>Resultado</h2><p id="score" class="summary" role="status">Todavía no corregiste el repaso.</p><div class="row no-print"><button id="grade" type="button">Corregir repaso</button><button id="reset" class="secondary" type="button">Reiniciar repaso</button></div></section></form><footer><p>Universidad Nacional de Hurlingham · Fundamentos de Sanidad Vegetal</p><p><a href="https://cropscience.bayer.co.uk/agronomy-id/diseases/oilseed-rape-diseases">Índice original de Bayer Crop Science</a> · <a href="https://agriculture.vic.gov.au/__data/assets/pdf_file/0012/901101/Field-Crop-Diseases-ID-manual-2022small.pdf">Agriculture Victoria · identificación</a> · <a href="https://ahdb.org.uk/knowledge-library/oilseed-rape-disease-management-guidance">AHDB · manejo de enfermedades</a></p></footer>';
  const form = get('questions');
  const cards = [...form.querySelectorAll('fieldset')];
  function refresh() {
    let correct = 0;
    let answered = 0;
    cards.forEach((card, index) => {
      const picked = answers[index];
      const hasAnswer = ['0','1','2'].includes(picked);
      if (hasAnswer) answered++;
      if (picked === '0') correct++;
      const feedback = card.querySelector('.feedback');
      feedback.hidden = !graded;
      feedback.classList.toggle('incorrect', picked !== '0');
      feedback.textContent = picked === '0' ? 'Correcta · 1 punto' :
        (hasAnswer ? 'Incorrecta' : 'Sin responder') + ' · 0 puntos. Respuesta correcta: ' + questions[index][2];
    });
    get('counter').textContent = answered + ' de 50 respondidas' + (graded ? ' · ' + correct + '/50 puntos' : '');
    get('score').textContent = graded ? correct + ' de 50 puntos · ' + (50-answered) + ' sin responder.' : 'Todavía no corregiste la evaluación.';
  }
  for (const input of form.querySelectorAll('input')) input.checked = answers[input.name.slice(1)] === input.value;
  form.addEventListener('change', ({target}) => {
    answers[target.name.slice(1)] = target.value;
    save();
    refresh();
  });
  get('print').addEventListener('click', () => window.print());
  get('grade').addEventListener('click', () => { graded = true; save(); refresh(); });
  get('reset').addEventListener('click', () => {
    if (!confirm('¿Reiniciar y borrar tus respuestas de este navegador?')) return;
    answers = {};
    graded = false;
    form.reset();
    save();
    refresh();
    exam.querySelector('h1').scrollIntoView();
  });
  refresh();
  get('gate').hidden = true;
  exam.hidden = false;
  document.getElementById(location.hash.slice(1))?.scrollIntoView();
}
get('access').addEventListener('submit', async event => {
  event.preventDefault();
  const button = event.currentTarget.querySelector('button');
  button.disabled = true;
  get('error').textContent = '';
  try {
    const [salt, iv, sealed] = get('pack').textContent.split('.').map(bytes);
    const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(get('pin').value.trim()), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:325000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);
    let clear;
    try { clear = await crypto.subtle.decrypt({name:'AES-GCM',iv},key,sealed); }
    catch { get('error').textContent = 'Clave incorrecta. Volvé a intentarlo.'; get('pin').select(); return; }
    render(JSON.parse(new TextDecoder().decode(clear)));
    get('pin').value = '';
  } catch { get('error').textContent = 'No se pudo abrir la evaluación. Recargá la página para volver a intentar.'; }
  finally { button.disabled = false; }
});
</script>
